<mat-toolbar class="app-toolbar">
  <div class="toolbar-brand">
    <mat-icon class="brand-icon">show_chart</mat-icon>
    <span class="brand-name">InvestFolio</span>
  </div>

  <nav class="toolbar-nav">
    <a mat-button routerLink="/" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }">
      <mat-icon>dashboard</mat-icon>
      <span>Dashboard</span>
    </a>
    <a mat-button routerLink="/portfolio" routerLinkActive="active-link">
      <mat-icon>account_balance_wallet</mat-icon>
      <span>Portfolio</span>
    </a>
  </nav>

  <span class="toolbar-spacer"></span>

  <button mat-icon-button aria-label="Notifications">
    <mat-icon>notifications_none</mat-icon>
  </button>
</mat-toolbar>

<main class="app-content">
  <router-outlet />
</main>
